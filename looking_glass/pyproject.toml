[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looking_glass"
version = "0.1.0"
description = "Layer B: the frozen customer-foundation donor (selective multi-scale SSM) + state/embedding tables plugins train on."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
# The package lives one level UP (repo root) since the package-flatten:
# <repo>/looking_glass/ IS the package. This makes `pip install -e looking_glass/`
# (from the repo root) work again.
package-dir = {"" = ".."}
packages = ["looking_glass"]

[tool.pytest.ini_options]
addopts = "-q"
